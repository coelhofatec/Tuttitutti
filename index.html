<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#0F2A33;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 480px at 88% 0%,rgba(79,179,174,.30),transparent 60%),radial-gradient(700px 420px at 0% 100%,rgba(183,121,31,.14),transparent 60%),linear-gradient(180deg,#FAF8F4 0%,#E6F1EE 100%)}
  main{width:100%;max-width:400px;background:#fff;border:1px solid #e4ded2;border-radius:22px;padding:34px 30px 30px;box-shadow:0 24px 48px -30px rgba(15,42,51,.5);text-align:center}
  img{height:48px;width:auto;display:block;margin:0 auto 22px}
  h1{font:700 22px "Space Grotesk",sans-serif;letter-spacing:-.02em;margin:0 0 6px}
  p{margin:0 0 20px;color:#51656c;font-size:14.5px}
  form{display:flex;flex-direction:column;gap:12px}
  input{font:500 16px "Inter",sans-serif;padding:14px 16px;border:1px solid #cfd8d6;border-radius:12px;outline:none;text-align:center}
  input:focus{border-color:#0D6E6B;box-shadow:0 0 0 3px rgba(13,110,107,.18)}
  button{font:600 15px "Inter",sans-serif;padding:14px;border:0;border-radius:12px;background:#0D6E6B;color:#fff;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.6;cursor:wait}
  .err{min-height:20px;margin:4px 0 0;color:#b42318;font-size:13.5px}
</style>
</head>

<script>
(function(){
  var D = JSON.parse(document.getElementById('d').textContent);
  var f = document.getElementById('f'), p = document.getElementById('p'), b = document.getElementById('b'), e = document.getElementById('e');
  function u8(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  async function abrir(senha){
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(D.s), iterations:D.i, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(D.v)}, key, u8(D.c));
    return new TextDecoder().decode(pt);
  }
  async function entrar(senha, auto){
    try {
      var html = await abrir(senha);
      try { sessionStorage.setItem('tt', senha); } catch (x) {}
      document.open(); document.write(html); document.close();
    } catch (x) {
      if (!auto) { e.textContent = 'Senha incorreta.'; p.select(); }
      try { sessionStorage.removeItem('tt'); } catch (y) {}
      b.disabled = false;
    }
  }
  f.addEventListener('submit', function(ev){
    ev.preventDefault(); e.textContent = ''; b.disabled = true;
    entrar(p.value.trim(), false);
  });
  var lembrada = null; try { lembrada = sessionStorage.getItem('tt'); } catch (x) {}
  if (lembrada) entrar(lembrada, true);
})();
</script>
